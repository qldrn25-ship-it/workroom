name: Build WORKROOM for Windows

on:
  push:
    branches: [main]
    paths:
      - 'WORKROOM_Windows_SourceClean_v17.zip'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unpack clean source
        shell: pwsh
        run: |
          if (!(Test-Path 'WORKROOM_Windows_SourceClean_v17.zip')) { throw 'Clean source zip not found' }
          Expand-Archive -Path 'WORKROOM_Windows_SourceClean_v17.zip' -DestinationPath 'build-src' -Force
          $pkg = Get-ChildItem -Path 'build-src' -Filter 'package.json' -Recurse | Select-Object -First 1
          if (!$pkg) { throw 'package.json not found' }
          "APP_DIR=$($pkg.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify source contains no executable payloads
        shell: pwsh
        run: |
          $forbidden = Get-ChildItem -Path 'build-src' -Recurse -File | Where-Object { $_.Extension -in '.exe','.dll','.msi','.bat','.cmd','.ps1','.vbs' }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Host $_.FullName }
            throw 'Executable payload found in source archive'
          }

      - name: Compile foreground helper from C# source
        shell: pwsh
        run: |
          $src = Join-Path $env:APP_DIR 'native\ForegroundHelper.cs'
          $out = Join-Path $env:APP_DIR 'native\foreground-helper.exe'
          if (!(Test-Path $src)) { throw 'ForegroundHelper.cs not found' }
          $csc = Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio" -Recurse -Filter csc.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'Roslyn' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$csc) { throw 'Modern Roslyn csc.exe not found' }
          Write-Host "Using compiler: $($csc.FullName)"
          & $csc.FullName /nologo /target:exe /optimize+ /langversion:latest /out:$out $src
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $out)) { throw 'Foreground helper compile failed' }

      - name: Defender scan native helper
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (!(Test-Path $mp)) { $mp = (Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform" -Recurse -Filter MpCmdRun.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName }
          & $mp -Scan -ScanType 3 -File "$env:APP_DIR\native\foreground-helper.exe"
          if ($LASTEXITCODE -ne 0) { throw "Defender detected native helper (exit $LASTEXITCODE)" }

      - name: Install Electron build dependencies
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          npm install

      - name: Build unpacked WORKROOM
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          Set-Location $env:APP_DIR
          npx electron-builder --win dir --x64 --publish never

      - name: Defender scan unpacked WORKROOM
        shell: pwsh
        run: |
          $app = Get-ChildItem -Path "$env:APP_DIR\dist" -Directory | Where-Object { $_.Name -match 'win-unpacked' } | Select-Object -First 1
          if (!$app) { throw 'win-unpacked output not found' }
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (!(Test-Path $mp)) { $mp = (Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform" -Recurse -Filter MpCmdRun.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName }
          & $mp -Scan -ScanType 3 -File $app.FullName
          if ($LASTEXITCODE -ne 0) { throw "Defender detected unpacked WORKROOM (exit $LASTEXITCODE)" }

      - name: Build portable and installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          Set-Location $env:APP_DIR
          npx electron-builder --win portable nsis --x64 --publish never

      - name: Defender scan final artifacts
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (!(Test-Path $mp)) { $mp = (Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform" -Recurse -Filter MpCmdRun.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName }
          $files = Get-ChildItem -Path "$env:APP_DIR\dist" -File | Where-Object { $_.Extension -eq '.exe' }
          if (!$files) { throw 'No final EXE artifacts found' }
          foreach ($f in $files) {
            Write-Host "Scanning $($f.Name)"
            & $mp -Scan -ScanType 3 -File $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "Defender detected $($f.Name) (exit $LASTEXITCODE)" }
          }

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "$env:APP_DIR\dist" -File | Where-Object { $_.Extension -eq '.exe' }
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($f.Name)"
          }
          $lines | Out-File -FilePath "$env:APP_DIR\dist\SHA256SUMS.txt" -Encoding ascii
          Get-Content "$env:APP_DIR\dist\SHA256SUMS.txt"

      - name: Upload Defender-clean Windows build
        uses: actions/upload-artifact@v4
        with:
          name: WORKROOM-Windows-v17-Defender-clean
          path: |
            ${{ env.APP_DIR }}/dist/*.exe
            ${{ env.APP_DIR }}/dist/SHA256SUMS.txt
          if-no-files-found: error
